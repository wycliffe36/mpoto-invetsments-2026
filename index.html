<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPOTO INVESTMENTS 2026</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);color:#fff;min-height:100vh;padding:15px}
.header{background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);border-radius:20px;padding:20px;text-align:center;border:1px solid rgba(255,255,255,0.2);margin-bottom:15px}
.header h1{margin:0;color:#ff9a00;font-size:22px} .header p{margin:5px 0 0;opacity:0.8;font-size:13px}
.grid{display:grid;grid-template-columns:1fr;gap:15px} @media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}
.card{background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);border-radius:20px;padding:18px;border:1px solid rgba(255,255,255,0.15)}
.card h3{margin:0 0 12px;color:#ff9a00;font-size:16px}
label{font-size:12px;opacity:0.8} input,select{width:100%;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,0.2);background:rgba(0,0,0,0.4);color:#fff;margin:6px 0 12px;font-size:14px}
button{width:100%;padding:14px;border-radius:12px;border:none;font-weight:bold;cursor:pointer;margin:6px 0;font-size:14px}
.btn-add{background:linear-gradient(135deg,#ff9a00,#ff6a00);color:#fff}
.btn-export{background:rgba(255,255,255,0.15);color:#fff;border:1px solid rgba(255,255,255,0.2)}
.kpi{display:flex;justify-content:space-between;background:rgba(0,0,0,0.3);padding:10px 14px;border-radius:10px;margin:6px 0}
.kpi span:last-child{color:#ff9a00;font-weight:bold}
table{width:100%;border-collapse:collapse;font-size:12px} th{color:#ff9a00;text-align:left;padding:8px;border-bottom:1px solid rgba(255,255,255,0.2)} td{padding:8px;border-bottom:1px solid rgba(255,255,255,0.1)}
</style>
</head>
<body>
<div class="header">
<h1>MPOTO INVESTMENTS 2026</h1>
<p>FoodPoint | Bar | Kitchen | Salon | M-Pesa Integrated</p>
<p id="liveTotal" style="color:#00ff88;font-weight:bold;margin-top:10px">Total: KES 0 | Today: KES 0</p>
</div>

<div class="grid">
<div class="card">
<h3>➕ Add New Sale</h3>
<label>Department</label>
<select id="dept" onchange="updateServices()"><option value="SALON">SALON</option><option value="BAR">BAR</option><option value="KITCHEN">KITCHEN</option><option value="FOODPOINT">FOODPOINT</option></select>
<label>Staff</label>
<select id="staff"><option>CHARLES</option><option>DIANA</option><option>EUNICE</option><option>PERIS</option><option>ABIGAEL MUTHAMA</option><option>BRENDA</option><option>MARTHA</option><option>CHRIS</option><option>WINCATE</option><option>GRACE</option><option>MAGDALENE</option><option>ABIGAEL MUTHONI</option></select>
<label>Service / Item</label>
<select id="service" onchange="updatePrice()"></select>
<label>Price (KES)</label>
<input id="price" type="number" placeholder="200">
<label>Payment</label>
<select id="pay"><option>M-PESA</option><option>CASH</option><option>BANK</option></select>
<button class="btn-add" onclick="addSale()">ADD SALE - SAVE</button>
<button class="btn-export" onclick="exportCSV()">📥 EXPORT TO EXCEL (CSV)</button>
</div>

<div class="card">
<h3>📊 Today's Summary</h3>
<div class="kpi"><span>Total Sales</span><span id="kpiTotal">KES 0</span></div>
<div class="kpi"><span>M-Pesa</span><span id="kpiMpesa">KES 0</span></div>
<div class="kpi"><span>Cash</span><span id="kpiCash">KES 0</span></div>
<div class="kpi"><span>Transactions</span><span id="kpiCount">0</span></div>
<div style="margin-top:12px"><button class="btn-export" onclick="clearAll()">🗑️ Clear All Data</button></div>
</div>
</div>

<div class="card" style="margin-top:15px">
<h3>📋 All Sales Records</h3>
<table id="salesTable"><tr><th>Date</th><th>Dept</th><th>Staff</th><th>Item</th><th>Price</th><th>Pay</th></tr></table>
</div>

<script>
const SERVICES={
SALON:{"Beard - 100":100,"Full head Plus Beard - 200":200,"Full head Plus Facial - 500":500,"Full Body Massage - 1500":1500,"Facial Scrubbing - 400":400,"Manicure - 300":300,"Pedicure - 400":400,"Braiding - 1500":1500},
BAR:{"Tusker - 300":300,"Pilsner - 300":300,"WhiteCap - 300":300,"Guinness - 350":350,"Smirnoff - 300":300,"Chrome Vodka - 250":250,"Gilbeys - 250":250,"Heineken - 350":350},
KITCHEN:{"Chapati - 30":30,"Ugali - 50":50,"Rice - 100":100,"Beef Fry - 350":350,"Chicken Fry - 450":450,"Fish Fry - 400":400,"Afya kubwa - 250":250,"Beans - 100":100},
FOODPOINT:{"Chapati - 350":350,"Afya kubwa - 250":250,"Pilau - 300":300,"Tea - 50":50,"Mandazi - 30":30,"Soda - 100":100}
};
let sales=JSON.parse(localStorage.getItem('MPOTO2026')||'[]');
function updateServices(){let d=document.getElementById('dept').value;let s=document.getElementById('service');s.innerHTML='';Object.keys(SERVICES[d]).forEach(k=>{let o=document.createElement('option');o.text=k;o.value=k;s.add(o)});updatePrice()}
function updatePrice(){let d=document.getElementById('dept').value;let sv=document.getElementById('service').value;document.getElementById('price').value=SERVICES[d][sv]||0}
function addSale(){let rec={date:new Date().toLocaleDateString(),time:new Date().toLocaleTimeString(),dept:document.getElementById('dept').value,staff:document.getElementById('staff').value,item:document.getElementById('service').value,price:parseInt(document.getElementById('price').value)||0,pay:document.getElementById('pay').value};if(!rec.price){alert('Enter price');return}sales.push(rec);localStorage.setItem('MPOTO2026',JSON.stringify(sales));render();alert('Sale Saved! '+rec.item+' KES '+rec.price)}
function render(){let t=document.getElementById('salesTable');t.innerHTML='<tr><th>Date</th><th>Dept</th><th>Staff</th><th>Item</th><th>Price</th><th>Pay</th></tr>';let total=0,mpesa=0,cash=0;let today=new Date().toLocaleDateString();let todayTotal=0;sales.slice().reverse().forEach(s=>{t.innerHTML+=`<tr><td>${s.date}</td><td>${s.dept}</td><td>${s.staff}</td><td>${s.item}</td><td>${s.price}</td><td>${s.pay}</td></tr>`;total+=s.price;if(s.pay==='M-PESA')mpesa+=s.price;if(s.pay==='CASH')cash+=s.price;if(s.date===today)todayTotal+=s.price});document.getElementById('kpiTotal').innerText='KES '+total;document.getElementById('kpiMpesa').innerText='KES '+mpesa;document.getElementById('kpiCash').innerText='KES '+cash;document.getElementById('kpiCount').innerText=sales.length;document.getElementById('liveTotal').innerText=`Total: KES ${total} | Today: KES ${todayTotal}`}
function exportCSV(){if(!sales.length){alert('No sales');return}let csv='Date,Time,Department,Staff,Item,Price,Payment\n';sales.forEach(s=>{csv+=`${s.date},${s.time},${s.dept},${s.staff},"${s.item}",${s.price},${s.pay}\n`});let blob=new Blob([csv],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='MPOTO_INVESTMENTS_2026_'+new Date().toISOString().slice(0,10)+'.csv';a.click()}
function clearAll(){if(confirm('Delete all sales?')){sales=[];localStorage.removeItem('MPOTO2026');render()}}
updateServices();render();
</script>
</body>
</html>
